# Infra sobe por padrão:        docker compose up -d   (SQL Server, Kafka, tópicos, Kafka UI em :8080)
# Infra + todos os serviços:    docker compose --profile apps up -d --build
name: marketplace

x-dotnet-service: &dotnet-service
  profiles: [apps]
  environment: &dotnet-env
    # Production: sem log detalhado por requisição. As migrações continuam automáticas no compose.
    ASPNETCORE_ENVIRONMENT: Production
    Database__MigrateOnStartup: "true"
    <<: &otel-env
      # Traces, métricas e logs vão para o Grafana (serviço observability). Métricas a cada 5 s para os painéis.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    Kafka__BootstrapServers: kafka:19092
    Jwt__Issuer: marketplace-users
    Jwt__Audience: marketplace
    Jwt__SigningKey: ${JWT_SIGNING_KEY}
  depends_on:
    sqlserver: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports: ["1433:1433"]
    volumes: [sqlserver-data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s

  # Kafka em modo KRaft (sem ZooKeeper). Dentro do compose: kafka:19092 · da sua máquina: localhost:9092
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tópicos só existem se declarados no kafka-init (ver ADR-003).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 12
      start_period: 15s

  # Declara os tópicos do marketplace (idempotente). Tópico novo: adicione aqui + context/events.md.
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in cart.checked-out order.placed stock.reserved stock.rejected shipment.status-changed; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list

  # Observabilidade: Grafana + Prometheus (métricas) + Tempo (traces) + Loki (logs) + coletor OpenTelemetry.
  # Grafana em http://localhost:3000 (sem login). Histórico no volume, 30 dias de métricas.
  observability:
    image: grafana/otel-lgtm:0.36.0
    ports: ["3000:3000", "4317:4317", "4318:4318", "9090:9090"]
    environment:
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=30d
    volumes:
      - observability-data:/data
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/marketplace.yaml:ro
      - ./observability/dashboards:/otel-lgtm/marketplace-dashboards:ro

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: marketplace
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

  users:
    <<: *dotnet-service
    build: { context: ., dockerfile: Dockerfile.dotnet, args: { PROJECT: src/services/Users/Users.Api, ASSEMBLY: Users.Api } }
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Server=sqlserver;Database=UsersDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True

  catalog:
    <<: *dotnet-service
    build: { context: ., dockerfile: Dockerfile.dotnet, args: { PROJECT: src/services/Catalog/Catalog.Api, ASSEMBLY: Catalog.Api } }
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Server=sqlserver;Database=CatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True

  cart:
    <<: *dotnet-service
    build: { context: ., dockerfile: Dockerfile.dotnet, args: { PROJECT: src/services/Cart/Cart.Api, ASSEMBLY: Cart.Api } }
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Server=sqlserver;Database=CartDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Services__Catalog: http://catalog:8080

  orders:
    profiles: [apps]
    build: ./src/services/Orders
    environment:
      ORDERS_DB_DSN: sqlserver://sa:${MSSQL_SA_PASSWORD}@sqlserver:1433?database=OrdersDb&TrustServerCertificate=true
      ORDERS_KAFKA_BROKERS: kafka:19092
      JWT_ISSUER: marketplace-users
      JWT_AUDIENCE: marketplace
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      <<: *otel-env
    depends_on:
      sqlserver: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  gateway:
    profiles: [apps]
    build: { context: ., dockerfile: Dockerfile.dotnet, args: { PROJECT: src/gateway/Gateway, ASSEMBLY: Gateway } }
    environment:
      <<: *otel-env
      ReverseProxy__Clusters__users__Destinations__d1__Address: http://users:8080/
      ReverseProxy__Clusters__catalog__Destinations__d1__Address: http://catalog:8080/
      ReverseProxy__Clusters__cart__Destinations__d1__Address: http://cart:8080/
      ReverseProxy__Clusters__orders__Destinations__d1__Address: http://orders:8080/
    ports: ["5000:8080"]
    depends_on: [users, catalog, cart, orders]

volumes:
  sqlserver-data:
  kafka-data:
  observability-data:
