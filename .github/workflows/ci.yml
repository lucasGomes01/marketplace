name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: .NET (build + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Testes de integração usam Testcontainers; o runner ubuntu já tem Docker.
      - run: dotnet test --no-build -c Release --logger "trx" --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"
      # Se falhar, guarda os resultados detalhados para investigar (ver ideia I-10 no BACKLOG).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dotnet-test-results
          path: tests/**/TestResults/
          retention-days: 7

  orders:
    name: Orders (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/services/Orders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/services/Orders/go.mod
      - run: go vet ./...
      - run: go test -race ./...

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [dotnet, orders, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile apps build
