name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: .NET (build + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Testes de integração usam Testcontainers; o runner ubuntu já tem Docker.
      - run: dotnet test --no-build -c Release --logger "trx" --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"
      # Se falhar, guarda os resultados detalhados para investigar (ver ideia I-10 no BACKLOG).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dotnet-test-results
          path: tests/**/TestResults/
          retention-days: 7

  orders:
    name: Orders (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/services/Orders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/services/Orders/go.mod
      - run: go vet ./...
      - run: go test -race ./...

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [dotnet, orders, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile apps build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [dotnet, orders, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/web/package-lock.json
            e2e/package-lock.json
      - run: cp .env.example .env
      # Sobe o sistema inteiro (SQL Server, Kafka, serviços, gateway) enquanto as dependências instalam.
      - run: docker compose --profile apps up -d --build
      - run: npm ci
        working-directory: src/web
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npm run wait-for-stack
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - if: failure()
        run: docker compose --profile apps logs --no-color > e2e/compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/compose.log
          retention-days: 7
      - if: always()
        run: docker compose --profile apps down -v
